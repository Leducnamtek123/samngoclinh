name: ack-nestjs-boilerplate

services:
    apis:
        build:
            context: .
            dockerfile: ci/dockerfile
        hostname: apis
        profiles: ["apis", "admin", "web"]
        ports:
            - 3000:3000
        env_file:
            - apps/api/.env
        environment:
            HTTP_HOST: 0.0.0.0
            DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/vismarttech?schema=public
            CACHE_REDIS_URL: redis://redis:6379/0
            QUEUE_REDIS_URL: redis://redis:6379/1
            AUTH_JWT_ACCESS_TOKEN_JWKS_URI: http://jwks-server/.well-known/access-jwks.json
            AUTH_JWT_REFRESH_TOKEN_JWKS_URI: http://jwks-server/.well-known/refresh-jwks.json
        restart: on-failure
        networks:
            - app-network
        depends_on:
            redis:
                condition: service_healthy
            postgres:
                condition: service_healthy
            jwks-server:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--no-verbose",
                    "--tries=1",
                    "--spider",
                    "http://127.0.0.1:3000/api/public/hello",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        deploy:
            resources:
                limits:
                    cpus: "1"
                    memory: 2G

    jwks-server:
        image: nginx:alpine
        hostname: jwks-server
        ports:
            - "3011:80"
        volumes:
            - ./apps/api/keys/access-jwks.json:/usr/share/nginx/html/.well-known/access-jwks.json:ro
            - ./apps/api/keys/refresh-jwks.json:/usr/share/nginx/html/.well-known/refresh-jwks.json:ro
            - ./ci/jwks-server/jwks.conf:/etc/nginx/conf.d/default.conf:ro
        networks:
            - app-network
        deploy:
            resources:
                limits:
                    cpus: "0.3"
                    memory: 128M
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--no-verbose",
                    "--tries=1",
                    "--spider",
                    "http://127.0.0.1:80/.well-known/access-jwks.json",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s

    vault:
        image: hashicorp/vault:latest
        hostname: vault
        profiles: ["vault"]
        cap_add:
            - IPC_LOCK
        ports:
            - "8200:8200"
        entrypoint: ["/bin/sh", "/vault/entrypoint.sh"]
        volumes:
            - ./ci/vault/entrypoint.sh:/vault/entrypoint.sh:ro
            - ./ci/vault/config.hcl:/vault/config.hcl:ro
            - vault_data:/vault/file
            - ./generated/vault:/vault/init
        networks:
            vault-network:
                aliases:
                    - vault
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -q -O- 'http://127.0.0.1:8200/v1/sys/health?standbycode=200' >/dev/null 2>&1 || exit 1",
                ]
            interval: 5s
            timeout: 3s
            retries: 15
            start_period: 5s

    vault-bootstrap:
        image: hashicorp/vault:latest
        profiles: ["vault"]
        entrypoint: ["/bin/sh", "/bootstrap.sh"]
        environment:
            VAULT_ADDR: http://vault:8200
            KV_MOUNT: ack-nestjs-boilerplate
        volumes:
            - ./ci/vault/bootstrap.sh:/bootstrap.sh:ro
            - ./ci/vault/policies:/policies:ro
            - ./.env.example:/seed/.env.example:ro
            - ./generated/vault:/vault/init
        networks:
            - vault-network
        depends_on:
            vault:
                condition: service_healthy

    redis:
        image: redis:latest
        hostname: redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        networks:
            - app-network
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 256M
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 30s
            retries: 5

    redis-bullboard:
        image: venatum/bull-board:latest
        hostname: redis-bullboard
        ports:
            - 3010:3000
        networks:
            - app-network
        environment:
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - BULL_PREFIX=Queue
            - USER_LOGIN=admin
            - USER_PASSWORD=admin123
            - REDIS_DB=1
        depends_on:
            redis:
                condition: service_healthy
        deploy:
            resources:
                limits:
                    cpus: "0.3"
                    memory: 128M

    postgres:
        image: postgres:17-alpine
        hostname: postgres
        ports:
            - "5435:5432"
        networks:
            - app-network
        volumes:
            - postgres_data:/var/lib/postgresql/data
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres123
            POSTGRES_DB: vismarttech
        deploy:
            resources:
                limits:
                    cpus: "1"
                    memory: 1GB
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d vismarttech"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    admin:
        build:
            context: .
            dockerfile: ci/dockerfile.admin
            args:
                - NEXT_PUBLIC_API_URL=http://localhost:3000/api
                - NEXT_PUBLIC_API_KEY=local_fyFGb7ywyM37TqDY8nuhAmGW5:qbp7LmCxYUTHFwKvHnxGW1aTyjSNU6ytN21etK89MaP2Dj2KZP
                - NEXT_PUBLIC_HOME_PATHNAME=/dashboards/analytics
        hostname: admin
        profiles: ["admin"]
        ports:
            - 3003:3003
        env_file:
            - apps/admin/.env.example
        environment:
            - PORT=3003
            - NEXTAUTH_URL=http://localhost:3003
            - BASE_URL=http://localhost:3003
            - API_URL=http://apis:3000/api
            - INTERNAL_API_URL=http://apis:3000/api
        depends_on:
            apis:
                condition: service_healthy
        networks:
            - app-network

    web:
        build:
            context: .
            dockerfile: ci/dockerfile.web
            args:
                - NEXT_PUBLIC_API_URL=http://localhost:3000/api
                - NEXT_PUBLIC_API_KEY=local_fyFGb7ywyM37TqDY8nuhAmGW5:qbp7LmCxYUTHFwKvHnxGW1aTyjSNU6ytN21etK89MaP2Dj2KZP
                - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_cmVsYXhlZC10dXJrZXktNjcuY2xlcmsuYWNjb3VudHMuZGV2JA
                - NEXT_PUBLIC_LOGGING_LEVEL=info
        hostname: web
        profiles: ["web"]
        ports:
            - 3002:3002
        env_file:
            - apps/web/.env.example
        environment:
            - PORT=3002
            - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/vismarttech
            - INTERNAL_API_URL=http://apis:3000/api
            - API_KEY=local_fyFGb7ywyM37TqDY8nuhAmGW5:qbp7LmCxYUTHFwKvHnxGW1aTyjSNU6ytN21etK89MaP2Dj2KZP
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - app-network

volumes:
    postgres_data:
    redis_data:
    vault_data:

networks:
    app-network:
        driver: bridge
    vault-network:
        driver: bridge
