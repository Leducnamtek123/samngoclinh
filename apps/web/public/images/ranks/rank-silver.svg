<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Silver Metallic Gradient -->
    <linearGradient id="silver_shield" x1="15" y1="10" x2="105" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="30%" stop-color="#94A3B8" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="silver_inner" x1="25" y1="20" x2="95" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="silver_rim" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="75%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="silver_glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#64748B" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#silver_glow)">
    <!-- Base Shield -->
    <path d="M60 8 L102 24 C102 68 60 108 60 108 C60 108 18 68 18 24 Z" 
          fill="url(#silver_shield)" 
          stroke="url(#silver_rim)" 
          stroke-width="2.5" 
          stroke-linejoin="round" />
    
    <!-- Inner Dark Crest Shield -->
    <path d="M60 16 L94 30 C94 66 60 98 60 98 C60 98 26 66 26 30 Z" 
          fill="url(#silver_inner)" 
          stroke="url(#silver_rim)" 
          stroke-width="1.2" />

    <!-- Ginseng Crown / Leaf Emblem in Silver -->
    <!-- Center Leaf -->
    <path d="M60 32 C58 42 54 50 60 62 C66 50 62 42 60 32 Z" fill="url(#silver_rim)" />
    <!-- Left Leaf -->
    <path d="M60 48 C50 42 42 46 38 56 C46 58 54 54 60 48 Z" fill="url(#silver_rim)" />
    <!-- Right Leaf -->
    <path d="M60 48 C70 42 78 46 82 56 C74 58 66 54 60 48 Z" fill="url(#silver_rim)" />
    <!-- Bottom Left Leaf -->
    <path d="M60 56 C52 56 46 62 44 72 C52 70 58 64 60 56 Z" fill="url(#silver_rim)" />
    <!-- Bottom Right Leaf -->
    <path d="M60 56 C68 56 74 62 76 72 C68 70 62 64 60 56 Z" fill="url(#silver_rim)" />

    <!-- 2 Stars (Silver Level) -->
    <polygon points="53,75 55,79 59,79.5 56,82 57,86 53,84 49,86 50,82 47,79.5 51,79" fill="#FFFFFF" stroke="#64748B" stroke-width="0.5" />
    <polygon points="67,75 69,79 73,79.5 70,82 71,86 67,84 63,86 64,82 61,79.5 65,79" fill="#FFFFFF" stroke="#64748B" stroke-width="0.5" />

    <!-- Text Ribbon SILVER -->
    <rect x="30" y="94" width="60" height="15" rx="7.5" fill="url(#silver_shield)" stroke="url(#silver_rim)" stroke-width="1" />
    <text x="60" y="104.5" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="1">BẠC</text>
  </g>
</svg>
