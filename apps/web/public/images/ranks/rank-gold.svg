<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Royal Gold Gradient -->
    <linearGradient id="gold_shield" x1="15" y1="10" x2="105" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="25%" stop-color="#EAB308" />
      <stop offset="60%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>
    <linearGradient id="gold_inner" x1="25" y1="20" x2="95" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#422006" />
      <stop offset="50%" stop-color="#281203" />
      <stop offset="100%" stop-color="#140801" />
    </linearGradient>
    <linearGradient id="gold_rim" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF9C3" />
      <stop offset="25%" stop-color="#FACC15" />
      <stop offset="50%" stop-color="#FEF08A" />
      <stop offset="75%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#713F12" />
    </linearGradient>
    <filter id="gold_glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#CA8A04" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#gold_glow)">
    <!-- Base Shield -->
    <path d="M60 8 L102 24 C102 68 60 108 60 108 C60 108 18 68 18 24 Z" 
          fill="url(#gold_shield)" 
          stroke="url(#gold_rim)" 
          stroke-width="2.5" 
          stroke-linejoin="round" />
    
    <!-- Inner Dark Crest Shield -->
    <path d="M60 16 L94 30 C94 66 60 98 60 98 C60 98 26 66 26 30 Z" 
          fill="url(#gold_inner)" 
          stroke="url(#gold_rim)" 
          stroke-width="1.2" />

    <!-- Ginseng Crown / Leaf Emblem in Brilliant Gold -->
    <!-- Center Leaf -->
    <path d="M60 30 C58 40 54 48 60 60 C66 48 62 40 60 30 Z" fill="url(#gold_rim)" />
    <!-- Left Leaf -->
    <path d="M60 46 C50 40 42 44 38 54 C46 56 54 52 60 46 Z" fill="url(#gold_rim)" />
    <!-- Right Leaf -->
    <path d="M60 46 C70 40 78 44 82 54 C74 56 66 52 60 46 Z" fill="url(#gold_rim)" />
    <!-- Bottom Left Leaf -->
    <path d="M60 54 C52 54 46 60 44 70 C52 68 58 62 60 54 Z" fill="url(#gold_rim)" />
    <!-- Bottom Right Leaf -->
    <path d="M60 54 C68 54 74 60 76 70 C68 68 62 62 60 54 Z" fill="url(#gold_rim)" />

    <!-- 3 Stars (Gold Level) -->
    <polygon points="46,75 48,78 51,78.5 49,81 50,84 46,82.5 42,84 43,81 41,78.5 44,78" fill="#FEF08A" stroke="#854D0E" stroke-width="0.5" />
    <polygon points="60,72 62.5,76 67,76.5 63.5,79.5 65,83.5 60,81 55,83.5 56.5,79.5 53,76.5 57.5,76" fill="#FEF08A" stroke="#854D0E" stroke-width="0.5" />
    <polygon points="74,75 76,78 79,78.5 77,81 78,84 74,82.5 70,84 71,81 69,78.5 72,78" fill="#FEF08A" stroke="#854D0E" stroke-width="0.5" />

    <!-- Text Ribbon GOLD -->
    <rect x="30" y="94" width="60" height="15" rx="7.5" fill="url(#gold_shield)" stroke="url(#gold_rim)" stroke-width="1" />
    <text x="60" y="104.5" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="900" fill="#422006" text-anchor="middle" letter-spacing="1">VÀNG</text>
  </g>
</svg>
