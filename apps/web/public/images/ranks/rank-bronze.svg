<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Bronze Metallic Gradient -->
    <linearGradient id="bronze_shield" x1="15" y1="10" x2="105" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CA8A04" />
      <stop offset="30%" stop-color="#92400E" />
      <stop offset="70%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="bronze_inner" x1="25" y1="20" x2="95" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="50%" stop-color="#2D1102" />
      <stop offset="100%" stop-color="#1E0B01" />
    </linearGradient>
    <linearGradient id="bronze_rim" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="25%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#FEF08A" />
      <stop offset="75%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <filter id="bronze_glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#92400E" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Ribbon Glow -->
  <g filter="url(#bronze_glow)">
    <!-- Base Shield -->
    <path d="M60 8 L102 24 C102 68 60 108 60 108 C60 108 18 68 18 24 Z" 
          fill="url(#bronze_shield)" 
          stroke="url(#bronze_rim)" 
          stroke-width="2.5" 
          stroke-linejoin="round" />
    
    <!-- Inner Dark Crest Shield -->
    <path d="M60 16 L94 30 C94 66 60 98 60 98 C60 98 26 66 26 30 Z" 
          fill="url(#bronze_inner)" 
          stroke="url(#bronze_rim)" 
          stroke-width="1.2" />

    <!-- Ginseng Crown / Leaf Emblem -->
    <!-- Center Leaf -->
    <path d="M60 32 C58 42 54 50 60 62 C66 50 62 42 60 32 Z" fill="url(#bronze_rim)" />
    <!-- Left Leaf -->
    <path d="M60 48 C50 42 42 46 38 56 C46 58 54 54 60 48 Z" fill="url(#bronze_rim)" />
    <!-- Right Leaf -->
    <path d="M60 48 C70 42 78 46 82 56 C74 58 66 54 60 48 Z" fill="url(#bronze_rim)" />
    <!-- Bottom Left Leaf -->
    <path d="M60 56 C52 56 46 62 44 72 C52 70 58 64 60 56 Z" fill="url(#bronze_rim)" />
    <!-- Bottom Right Leaf -->
    <path d="M60 56 C68 56 74 62 76 72 C68 70 62 64 60 56 Z" fill="url(#bronze_rim)" />

    <!-- Single Star (Bronze Level) -->
    <polygon points="60,74 62.5,79 68,79.5 64,83 65.5,88 60,85 54.5,88 56,83 52,79.5 57.5,79" fill="#FDE047" stroke="#92400E" stroke-width="0.5" />

    <!-- Text Ribbon BRONZE -->
    <rect x="30" y="94" width="60" height="15" rx="7.5" fill="url(#bronze_shield)" stroke="url(#bronze_rim)" stroke-width="1" />
    <text x="60" y="104.5" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="900" fill="#FEF08A" text-anchor="middle" letter-spacing="1">ĐỒNG</text>
  </g>
</svg>
