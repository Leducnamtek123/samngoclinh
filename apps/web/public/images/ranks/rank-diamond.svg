<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Diamond Cyan / Ice Blue Gradient -->
    <linearGradient id="diamond_shield" x1="15" y1="10" x2="105" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="25%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="diamond_inner" x1="25" y1="20" x2="95" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#082F49" />
      <stop offset="50%" stop-color="#031E30" />
      <stop offset="100%" stop-color="#010E18" />
    </linearGradient>
    <linearGradient id="diamond_rim" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#7DD3FC" />
      <stop offset="50%" stop-color="#BAE6FD" />
      <stop offset="75%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="diamond_glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284C7" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#diamond_glow)">
    <!-- Base Shield -->
    <path d="M60 8 L102 24 C102 68 60 108 60 108 C60 108 18 68 18 24 Z" 
          fill="url(#diamond_shield)" 
          stroke="url(#diamond_rim)" 
          stroke-width="2.5" 
          stroke-linejoin="round" />
    
    <!-- Inner Dark Crest Shield -->
    <path d="M60 16 L94 30 C94 66 60 98 60 98 C60 98 26 66 26 30 Z" 
          fill="url(#diamond_inner)" 
          stroke="url(#diamond_rim)" 
          stroke-width="1.2" />

    <!-- Diamond Facet Polygon -->
    <polygon points="60,28 76,38 70,54 60,66 50,54 44,38" fill="url(#diamond_rim)" opacity="0.25" />
    <polygon points="60,28 76,38 60,44 44,38" fill="#FFFFFF" opacity="0.6" />
    <polygon points="44,38 60,44 50,54" fill="#38BDF8" opacity="0.8" />
    <polygon points="76,38 60,44 70,54" fill="#0284C7" opacity="0.8" />
    <polygon points="50,54 60,44 70,54 60,66" fill="#BAE6FD" opacity="0.9" />

    <!-- 4 Stars (Diamond Level) -->
    <polygon points="38,76 40,78.5 43,79 41,81 42,83.5 38,82 34,83.5 35,81 33,79 36,78.5" fill="#BAE6FD" />
    <polygon points="52,73 54,75.5 57,76 55,78 56,80.5 52,79 48,80.5 49,78 47,76 50,75.5" fill="#FFFFFF" />
    <polygon points="68,73 70,75.5 73,76 71,78 72,80.5 68,79 64,80.5 65,78 63,76 66,75.5" fill="#FFFFFF" />
    <polygon points="82,76 84,78.5 87,79 85,81 86,83.5 82,82 78,83.5 79,81 77,79 80,78.5" fill="#BAE6FD" />

    <!-- Text Ribbon DIAMOND -->
    <rect x="25" y="94" width="70" height="15" rx="7.5" fill="url(#diamond_shield)" stroke="url(#diamond_rim)" stroke-width="1" />
    <text x="60" y="104.5" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="900" fill="#082F49" text-anchor="middle" letter-spacing="0.5">KIM CƯƠNG</text>
  </g>
</svg>
