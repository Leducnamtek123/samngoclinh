<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Imperial Emerald Gradient -->
    <linearGradient id="vip_emerald" x1="15" y1="10" x2="105" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="25%" stop-color="#059669" />
      <stop offset="60%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <!-- Royal 24K Gold Rim -->
    <linearGradient id="vip_gold_rim" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF9C3" />
      <stop offset="20%" stop-color="#FACC15" />
      <stop offset="50%" stop-color="#FEF08A" />
      <stop offset="75%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#713F12" />
    </linearGradient>
    <linearGradient id="vip_inner" x1="25" y1="20" x2="95" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#022C22" />
      <stop offset="100%" stop-color="#011812" />
    </linearGradient>
    <filter id="vip_glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#059669" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#vip_glow)">
    <!-- Base Shield -->
    <path d="M60 8 L102 24 C102 68 60 108 60 108 C60 108 18 68 18 24 Z" 
          fill="url(#vip_emerald)" 
          stroke="url(#vip_gold_rim)" 
          stroke-width="2.5" 
          stroke-linejoin="round" />
    
    <!-- Inner Dark Crest Shield -->
    <path d="M60 16 L94 30 C94 66 60 98 60 98 C60 98 26 66 26 30 Z" 
          fill="url(#vip_inner)" 
          stroke="url(#vip_gold_rim)" 
          stroke-width="1.2" />

    <!-- Imperial Crown above Ginseng -->
    <path d="M46 36 L50 44 L60 38 L70 44 L74 36 L72 48 L48 48 Z" fill="url(#vip_gold_rim)" />
    <!-- Crown Jewels -->
    <circle cx="46" cy="35" r="1.5" fill="#FEF08A" />
    <circle cx="60" cy="37" r="2" fill="#FEF08A" />
    <circle cx="74" cy="35" r="1.5" fill="#FEF08A" />

    <!-- Ginseng Flower / Heart Emblem -->
    <path d="M60 48 C58 54 54 58 60 66 C66 58 62 54 60 48 Z" fill="url(#vip_gold_rim)" />
    <path d="M60 56 C52 52 46 54 44 60 C50 61 56 59 60 56 Z" fill="url(#vip_gold_rim)" />
    <path d="M60 56 C68 52 74 54 76 60 C70 61 64 59 60 56 Z" fill="url(#vip_gold_rim)" />

    <!-- 5 Luxury Stars (VIP Elite Level) -->
    <polygon points="32,77 33.5,79 36,79.5 34.5,81 35,83 32,82 29,83 29.5,81 28,79.5 30.5,79" fill="#FACC15" />
    <polygon points="46,74 47.5,76 50,76.5 48.5,78 49,80 46,79 43,80 43.5,78 42,76.5 44.5,76" fill="#FEF08A" />
    <polygon points="60,71 62,73.5 65,74 63,76 64,78.5 60,77 56,78.5 57,76 55,74 58,73.5" fill="#FFFFFF" />
    <polygon points="74,74 75.5,76 78,76.5 76.5,78 77,80 74,79 71,80 71.5,78 70,76.5 72.5,76" fill="#FEF08A" />
    <polygon points="88,77 89.5,79 92,79.5 90.5,81 91,83 88,82 85,83 85.5,81 84,79.5 86.5,79" fill="#FACC15" />

    <!-- Text Ribbon VIP TINH HOA -->
    <rect x="25" y="94" width="70" height="15" rx="7.5" fill="url(#vip_emerald)" stroke="url(#vip_gold_rim)" stroke-width="1.2" />
    <text x="60" y="104.5" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="900" fill="#FEF08A" text-anchor="middle" letter-spacing="1">VIP TINH HOA</text>
  </g>
</svg>
